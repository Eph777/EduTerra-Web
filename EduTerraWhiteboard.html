<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>EduTerra Whiteboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: an infinite whiteboard. Marker-handwriting zone titles, illustrated cards per component, sticky notes for risks; colour = layer (same as the System Atlas). Deliberately single light theme: it is a whiteboard. */
:root{
  color-scheme:light;
  --board:#FCFDFD; --dots:#D9E0E6; --ink:#1B2530; --ink-2:#3C4A57; --muted:#64717D; --line:#D6DDE3; --chrome:#FFFFFF;
  --game:#2E9150; --api:#D9731A; --db:#2F6DB8; --map:#0E8E90; --ops:#6A55BE; --red:#CF4136; --bk:#56616C;
  --sticky:#FFE680; --sticky-risk:#FFD0C7;
  --hand:"Kalam","Comic Neue","Segoe Print","Bradley Hand",cursive;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--board);color:var(--ink);font:400 14px/1.5 var(--sans);overflow:hidden;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--chrome)}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--db);outline-offset:3px}

/* ---------- top bar ---------- */
.bar{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:30;background:var(--chrome);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:8px;flex:none}
.brand b{font:700 22px/1 var(--hand)}
.brand span{font:500 12px/1 var(--mono);color:var(--muted)}
.brand time{font:500 11px/1 var(--mono);color:var(--muted);opacity:.8}
.brand time::before{content:"· ";}
.steps{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.steps button{flex:none;border:1.5px solid transparent;background:none;border-radius:999px;padding:6px 12px;font:500 13px/1 var(--sans);color:var(--ink-2);cursor:pointer;white-space:nowrap}
.steps button:hover{background:#EEF2F5}
.steps button[aria-current="true"]{border-color:var(--ink);color:var(--ink);background:#fff}
.steps button i{font-style:normal;font-family:var(--mono);color:var(--muted);margin-right:5px;font-size:12px}
.paths{display:flex;gap:6px;flex:none}
.paths button{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font:500 12.5px/1 var(--sans);cursor:pointer}
.paths button i{width:16px;height:3px;border-radius:2px;display:inline-block}
.paths button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
@media (max-width:900px){.paths{display:none}.brand span,.brand time{display:none}}

/* ---------- canvas ---------- */
#vp{position:fixed;inset:0;cursor:grab;touch-action:none;
  background-color:var(--board);background-image:radial-gradient(var(--dots) 1.2px,transparent 1.3px);background-size:24px 24px}
#vp.dragging{cursor:grabbing}
#board{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:1}

.zone{position:absolute;border:2.5px dashed #C4CDD5;border-radius:26px;z-index:0}
.zone-title{position:absolute;left:22px;top:-26px;background:var(--board);border:0;padding:0 10px;cursor:zoom-in;
  font:700 34px/1.2 var(--hand);color:var(--zc)}
.zone-title small{font:400 19px/1 var(--hand);color:var(--muted);margin-left:10px}
.zone-title:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}

.node{position:absolute;z-index:2;width:236px;text-align:left;background:#fff;border:2px solid var(--ink);border-radius:16px;
  padding:14px 16px 14px;cursor:pointer;box-shadow:4px 5px 0 var(--c);transition:transform .15s,box-shadow .15s,opacity .25s}
.node:hover{transform:translate(-2px,-2px);box-shadow:6px 7px 0 var(--c)}
.node .ill{display:block;width:76px;height:76px;margin:-4px 0 6px -4px}
.node .ill svg{width:100%;height:100%;display:block}
.node .nt{font:700 17px/1.2 var(--sans);display:block}
.node .nd{font:400 13.5px/1.4 var(--sans);color:var(--ink-2);display:block;margin-top:4px}
.node .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.node .tags span{font:600 11.5px/1 var(--mono);padding:4px 7px;border-radius:6px;background:color-mix(in srgb,var(--c) 13%,#fff);color:color-mix(in srgb,var(--c) 75%,#000)}
.node .more{position:absolute;right:12px;top:12px;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 16px/1 var(--sans);color:var(--muted)}
.node:hover .more,.node.sel .more{border-color:var(--c);color:var(--c)}
.node.big{width:300px}
.node .layers{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.node .layers span{display:flex;align-items:center;gap:8px;font:500 13px/1.3 var(--sans);border:1.5px solid var(--line);border-radius:8px;padding:7px 9px}
.node .layers i{width:12px;height:12px;border-radius:3px;flex:none}
.node .sub{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;border-radius:10px;border:1.5px dashed var(--c);font:600 12.5px/1.3 var(--mono);color:var(--ink-2)}

.sticky{position:absolute;z-index:2;width:206px;text-align:left;border:0;padding:16px 16px 18px;cursor:pointer;background:var(--sticky);
  font:400 19px/1.25 var(--hand);color:var(--ink);box-shadow:0 10px 18px -10px rgba(27,37,48,.45),0 1px 0 rgba(27,37,48,.08);transform:rotate(var(--rot,-1.5deg));transition:transform .15s,opacity .25s}
.sticky.risk{background:var(--sticky-risk)}
.sticky::before{content:"";position:absolute;left:50%;top:-9px;width:64px;height:20px;margin-left:-32px;background:rgba(255,255,255,.55);border:1px solid rgba(27,37,48,.08);transform:rotate(-3deg)}
.sticky b{display:block;font:700 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;color:var(--red)}
.sticky.tip b{color:#7A6400}
.sticky:hover{transform:rotate(0deg) scale(1.03)}
.sticky.pulse{animation:pulse 1.6s ease-in-out 3}
@keyframes pulse{50%{transform:rotate(0deg) scale(1.07)}}

/* edges */
.edge path{fill:none;stroke-width:3;stroke-linecap:round;transition:opacity .25s,stroke-width .2s}
.edge text{font:700 16px var(--hand);paint-order:stroke;stroke:var(--board);stroke-width:7px;stroke-linejoin:round;transition:opacity .25s}
.g-track path{stroke:var(--api)} .g-track text{fill:var(--api)}
.g-map path{stroke:var(--map)} .g-map text{fill:var(--map)}
.g-setup path{stroke:var(--ops);stroke-dasharray:9 8} .g-setup text{fill:var(--ops)}
.g-backup path{stroke:var(--bk);stroke-dasharray:3 7} .g-backup text{fill:var(--bk)}

/* focus mode */
#board.focusing .node:not(.on),#board.focusing .sticky:not(.on){opacity:.22}
#board.focusing .edge:not(.on){opacity:.12}
#board.focusing .edge.on path{stroke-width:4.5}
@media (prefers-reduced-motion:no-preference){
  #board.focusing .edge.on.flow path{stroke-dasharray:12 10;animation:flow .9s linear infinite}
}
@keyframes flow{to{stroke-dashoffset:-22}}
.node.sel{outline:3px solid var(--c);outline-offset:5px}

/* ---------- controls ---------- */
.zoom{position:fixed;z-index:20;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;background:var(--chrome);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 16px -10px rgba(27,37,48,.4)}
.zoom button{border:0;background:none;width:38px;height:38px;cursor:pointer;font:600 18px/1 var(--sans);border-radius:10px}
.zoom button:hover{background:#EEF2F5}
.zoom output{min-width:52px;text-align:center;font:500 12.5px/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.zoom .fit{font:500 12.5px/1 var(--sans);width:auto;padding:0 12px}

#mini{position:fixed;z-index:20;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:208px;height:132px;
  background:var(--chrome);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 16px -10px rgba(27,37,48,.4);cursor:pointer}
#mini rect.z{fill:none;stroke:#C4CDD5;stroke-width:14;stroke-dasharray:30 24}
#mini rect.n{stroke:none}
#mini rect.v{fill:rgba(47,109,184,.08);stroke:var(--db);stroke-width:16}
@media (max-width:640px){#mini{display:none}}

.hint{position:fixed;z-index:20;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);background:var(--ink);color:#fff;font:500 12.5px/1 var(--sans);padding:9px 14px;border-radius:999px;white-space:nowrap;transition:opacity .4s;pointer-events:none}
.hint.gone{opacity:0}

/* caption / speaker notes */
.cap{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(660px,calc(100% - 520px));min-width:300px;
  background:var(--chrome);border:2px solid var(--ink);border-radius:16px;padding:12px 14px 12px 18px;box-shadow:5px 6px 0 var(--ink);display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.cap .k{font:600 11.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);grid-column:1}
.cap p{margin:0;font:400 15px/1.45 var(--sans);grid-column:1;min-width:0}
.cap .nav{grid-column:2;grid-row:1 / span 2;display:flex;gap:6px}
.cap .nav button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font:600 18px/1 var(--sans)}
.cap .nav button:hover{border-color:var(--ink)}
.cap .nav button:disabled{opacity:.35;cursor:default}
@media (max-width:1100px){.cap{width:calc(100% - 32px);min-width:0;bottom:calc(68px + env(safe-area-inset-bottom,0px))}}

/* detail panel */
#panel{position:fixed;z-index:25;right:0;top:calc(env(safe-area-inset-top,0px) + 53px);bottom:0;width:390px;max-width:100%;background:var(--chrome);border-left:2px solid var(--ink);
  overflow-y:auto;padding:22px 22px calc(28px + env(safe-area-inset-bottom,0px));padding-right:max(22px,env(safe-area-inset-right,0px));box-shadow:-10px 0 30px -18px rgba(27,37,48,.5)}
#panel .ph{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;margin-bottom:6px}
#panel .ph .ill svg{width:64px;height:64px;display:block}
#panel h2{margin:0;font:700 21px/1.2 var(--sans);text-wrap:balance}
#panel .layer{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--pc);display:block;margin-bottom:5px}
#panel .x{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font:500 20px/1 var(--sans)}
#panel .role{font:400 19px/1.35 var(--hand);color:var(--ink);margin:14px 0 14px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--pc) 10%,#fff);border:1.5px solid color-mix(in srgb,var(--pc) 40%,#fff)}
#panel h3{font:600 11.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
#panel ul{margin:0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:7px}
#panel li{font-size:14.5px;line-height:1.45}
#panel li::marker{color:var(--pc)}
#panel code{font:400 12.5px/1.4 var(--mono);background:#EEF2F5;padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
#panel .files{display:flex;flex-wrap:wrap;gap:6px}
#panel .files code{padding:4px 8px}
#panel .cmd{display:flex;gap:8px;align-items:stretch;margin-bottom:6px}
#panel .cmd pre{flex:1;min-width:0;margin:0;background:#16202A;color:#E6EDF3;border-radius:8px;padding:9px 11px;font:400 12.5px/1.45 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
#panel .cmd button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:0 10px;cursor:pointer;font:500 12px/1 var(--sans)}
#panel .links{display:flex;flex-wrap:wrap;gap:6px}
#panel .links button{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px 6px 8px;cursor:pointer;font:500 13px/1 var(--sans)}
#panel .links button:hover{border-color:var(--ink)}
#panel .links i{width:10px;height:10px;border-radius:50%}
@media (max-width:640px){#panel{top:auto;height:62%;width:100%;border-left:0;border-top:2px solid var(--ink);border-radius:18px 18px 0 0}}
</style>

<header class="bar">
  <div class="brand"><b>EduTerra</b><span>system whiteboard</span><time datetime="2026-10" title="Last updated">updated Oct 2026</time></div>
  <nav class="steps" id="steps" aria-label="Guided tour"></nav>
  <div class="paths" role="group" aria-label="Highlight a path">
    <button id="p-track" aria-pressed="false" data-g="track"><i style="background:var(--api)"></i>Positions</button>
    <button id="p-map" aria-pressed="false" data-g="map"><i style="background:var(--map)"></i>Map image</button>
    <button id="p-setup" aria-pressed="false" data-g="setup"><i style="background:var(--ops)"></i>Setup</button>
  </div>
</header>

<div id="vp" aria-label="Whiteboard. Drag to move, scroll or pinch to zoom, click a card for details.">
  <div id="board">
    <div id="zones"></div>
    <svg id="edges" aria-hidden="true">
      <defs>
        <marker id="m-track" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 z" style="fill:var(--api)"/></marker>
        <marker id="m-map" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 z" style="fill:var(--map)"/></marker>
        <marker id="m-setup" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 z" style="fill:var(--ops)"/></marker>
        <marker id="m-backup" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 z" style="fill:var(--bk)"/></marker>
      </defs>
      <g id="edge-layer"></g>
    </svg>
    <div id="nodes"></div>
  </div>
</div>

<div class="hint" id="hint">Drag to move · scroll or pinch to zoom · click any card · ← → to present</div>

<div class="zoom" role="group" aria-label="Zoom">
  <button id="z-out" aria-label="Zoom out">−</button>
  <output id="z-val">100%</output>
  <button id="z-in" aria-label="Zoom in">+</button>
  <button id="z-fit" class="fit">Fit all</button>
</div>

<svg id="mini" viewBox="0 0 2640 1680" role="img" aria-label="Minimap. Click to jump."></svg>

<section class="cap" id="cap" aria-live="polite">
  <span class="k" id="cap-k"></span>
  <p id="cap-t"></p>
  <div class="nav"><button id="prev" aria-label="Previous step">←</button><button id="next" aria-label="Next step">→</button></div>
</section>

<aside id="panel" hidden aria-label="Details"></aside>

<script>
(() => {

function rectOf(id){
  if (id.startsWith('zone:')) return null;
  const el = nodesEl.querySelector(`[data-id="${id}"]`);
  return {x:el.offsetLeft, y:el.offsetTop, w:el.offsetWidth, h:el.offsetHeight};
}
function drawEdges(){
  edgeLayer.innerHTML = EDGES.map((e,i) => {
    const A = rectOf(e.f); let s, en, c1, c2;
    if (e.t.startsWith('zone:')){
      const [, zid, yy] = e.t.split(':'); const z = ZONES.find(q=>q.id===zid);
      s = {x:A.x+A.w, y:A.y+A.h/2}; en = {x:z.x-2, y:+yy};
      const k = Math.max(60,(en.x-s.x)/2); c1 = {x:s.x+k,y:s.y}; c2 = {x:en.x-k,y:en.y};
    } else {
      const B = rectOf(e.t);
      const ac = {x:A.x+A.w/2,y:A.y+A.h/2}, bc = {x:B.x+B.w/2,y:B.y+B.h/2};
      const dx = bc.x-ac.x, dy = bc.y-ac.y;
      if (Math.abs(dx) > Math.abs(dy)*0.9){
        const sg = Math.sign(dx);
        s = {x: sg>0?A.x+A.w:A.x, y:ac.y}; en = {x: sg>0?B.x-4:B.x+B.w+4, y:Math.min(B.y+B.h-28, Math.max(B.y+28, ac.y))};
        const k = Math.max(40,Math.abs(en.x-s.x)/2); c1={x:s.x+sg*k,y:s.y}; c2={x:en.x-sg*k,y:en.y};
      } else {
        const sg = Math.sign(dy);
        s = {x:ac.x, y: sg>0?A.y+A.h:A.y}; en = {x:Math.min(B.x+B.w-28, Math.max(B.x+28, ac.x)), y: sg>0?B.y-4:B.y+B.h+4};
        const k = Math.max(40,Math.abs(en.y-s.y)/2); c1={x:s.x,y:s.y+sg*k}; c2={x:en.x,y:en.y-sg*k};
      }
    }
    const mx = .125*s.x+.375*c1.x+.375*c2.x+.125*en.x, my = .125*s.y+.375*c1.y+.375*c2.y+.125*en.y;
    const flow = (e.g==='track'||e.g==='map') ? ' flow' : '';
    return `<g class="edge g-${e.g}${flow}" data-i="${i}" data-f="${e.f}" data-t="${e.t}">
      <path d="M${s.x},${s.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${en.x},${en.y}" marker-end="url(#m-${e.g})"${e.both?` marker-start="url(#m-${e.g})"`:''}/>
      <text x="${mx}" y="${my-10}" text-anchor="middle">${e.l}</text></g>`;
  }).join('');
}

function panelW(){ const p = $('#panel'); return (!p.hidden && innerWidth > 640) ? p.offsetWidth : 0; }
function bottomReserve(){ const c = $('#cap'); return c.hidden ? 70 : (innerHeight - c.getBoundingClientRect().top) + 14; }
function viewFor(r, pad=40){
  const availW = innerWidth - panelW(), t = topH(), availH = innerHeight - t - bottomReserve();
  const s = Math.min(MAX, Math.max(MIN, Math.min((availW-2*pad)/r.w, (availH-2*pad)/r.h)));
  return {s, x: availW/2 - (r.x + r.w/2)*s, y: t + availH/2 - (r.y + r.h/2)*s};
}
let anim = 0;
function goTo(v, ms=650){
  cancelAnimationFrame(anim);
  if (reduce || ms===0){ tx=v.x; ty=v.y; sc=v.s; apply(); return; }
  const f = {x:tx,y:ty,s:sc}, t0 = performance.now();
  const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
  const step = now => { const p = Math.min(1,(now-t0)/ms), e = ease(p);
    tx = f.x+(v.x-f.x)*e; ty = f.y+(v.y-f.y)*e; sc = f.s+(v.s-f.s)*e; apply();
    if (p<1) anim = requestAnimationFrame(step); };
  anim = requestAnimationFrame(step);
}
function areaRect(a){
  if (a==='all') return {x:20,y:60,w:BW-20,h:BH-40};
  const z = ZONES.find(q=>q.id===a); return {x:z.x-20,y:z.y-50,w:z.w+40,h:z.h+70};
}
function zoomAt(f, px, py){
  cancelAnimationFrame(anim);
  const ns = Math.min(MAX, Math.max(MIN, sc*f));
  tx = px - (px-tx)*(ns/sc); ty = py - (py-ty)*(ns/sc); sc = ns; apply();
}

/* ---------- focus / highlight ---------- */
function clearFocus(){
  board.classList.remove('focusing');
  board.querySelectorAll('.on,.sel').forEach(el=>el.classList.remove('on','sel'));
  document.querySelectorAll('.paths button').forEach(b=>b.setAttribute('aria-pressed','false'));
}
function focusGroups(gs){
  clearFocus(); if (!gs) return;
  const set = new Set(gs.split('+'));
  if (set.has('risk')){
    board.classList.add('focusing');
    board.querySelectorAll('.sticky.risk').forEach(el=>{el.classList.add('on'); if(!reduce){el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');}});
    return;
  }
  board.classList.add('focusing');
  board.querySelectorAll('.edge').forEach(el => {
    const e = EDGES[+el.dataset.i]; if (!set.has(e.g)) return;
    el.classList.add('on');
    [e.f, e.t].forEach(id => { const n = nodesEl.querySelector(`[data-id="${id}"]`); if (n) n.classList.add('on'); });
  });
  set.forEach(g => { const b = document.querySelector(`.paths [data-g="${g}"]`); if (b && set.size===1) b.setAttribute('aria-pressed','true'); });
}
function focusNode(id){
  clearFocus(); board.classList.add('focusing');
  const el = nodesEl.querySelector(`[data-id="${id}"]`); el.classList.add('on','sel');
  board.querySelectorAll('.edge').forEach(g => {
    const e = EDGES[+g.dataset.i];
    if (e.f===id || e.t===id){ g.classList.add('on');
      [e.f,e.t].forEach(o => { const n = nodesEl.querySelector(`[data-id="${o}"]`); if (n) n.classList.add('on'); }); }
  });
}

/* ---------- detail panel ---------- */
const panel = $('#panel');
function neighbors(id){
  const out = [];
  EDGES.forEach(e => { if (e.f===id && !e.t.startsWith('zone:')) out.push([e.t,e.l]); if (e.t===id) out.push([e.f,e.l]); });
  return out;
}
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function openPanel(id){
  const n = byId[id]; const isSticky = !n.icon;
  const pc = isSticky ? (n.tip ? '#7A6400' : 'var(--red)') : n.c;
  const icon = isSticky ? `<svg viewBox="0 0 64 64"><rect x="8" y="8" width="48" height="48" rx="3" fill="${n.tip?'#FFE680':'#FFD0C7'}" ${S}/><path d="M20 24h24M20 33h24M20 42h14" stroke="#1B2530" stroke-width="2.4" stroke-linecap="round"/></svg>` : ICON[n.icon];
  const nb = neighbors(id);
  panel.style.setProperty('--pc', pc);
  panel.innerHTML = `
    <div class="ph"><span class="ill">${icon}</span><div><span class="layer">${n.layer}</span><h2>${isSticky ? n.t.replace('\n',' ') : n.t}</h2></div><button class="x" id="close" aria-label="Close details">×</button></div>
    <p class="role">${n.role}</p>
    <h3>Key points</h3><ul>${n.pts.map(p=>`<li>${p}</li>`).join('')}</ul>
    ${n.files && n.files.length ? `<h3>Files</h3><div class="files">${n.files.map(f=>`<code>${f}</code>`).join('')}</div>`:''}
    ${n.cmds && n.cmds.length ? `<h3>Try it</h3>${n.cmds.map((c,i)=>`<div class="cmd"><pre id="cmd-${i}">${esc(c)}</pre><button data-copy="${i}">Copy</button></div>`).join('')}`:''}
    ${nb.length ? `<h3>Connected to</h3><div class="links">${nb.map(([o,l])=>`<button data-go="${o}"><i style="background:${byId[o].c}"></i>${byId[o].t} <span style="color:var(--muted)">· ${l}</span></button>`).join('')}</div>`:''}`;
  panel.hidden = false; panel.scrollTop = 0;
  if (!isSticky) focusNode(id); else { clearFocus(); board.classList.add('focusing'); nodesEl.querySelector(`[data-id="${id}"]`).classList.add('on'); }
  revealNode(id);
  $('#close').focus({preventScroll:true});
}
function closePanel(){ panel.hidden = true; clearFocus(); }
function revealNode(id){
  const el = nodesEl.querySelector(`[data-id="${id}"]`);
  const r = {x:el.offsetLeft, y:el.offsetTop, w:el.offsetWidth, h:el.offsetHeight};
  const sx = tx + r.x*sc, sy = ty + r.y*sc, sw = r.w*sc, sh = r.h*sc;
  const availW = innerWidth - panelW();
  const phone = innerWidth <= 640, limitB = phone ? innerHeight*0.38 : innerHeight - bottomReserve();
  const fits = sx > 16 && sx+sw < availW-16 && sy > topH()+10 && sy+sh < limitB && sc > 0.45;
  if (fits) return;
  const s = Math.max(sc, 0.7);
  const cx = availW/2, cy = phone ? (topH() + limitB)/2 : topH() + (limitB - topH())/2;
  goTo({s, x: cx - (r.x+r.w/2)*s, y: cy - (r.y+r.h/2)*s}, 500);
}
panel.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id==='close') return closePanel();
  if (b.dataset.go) return openPanel(b.dataset.go);
  if (b.dataset.copy !== undefined){
    const pre = panel.querySelector('#cmd-'+b.dataset.copy), txt = pre.textContent;
    const done = () => { b.textContent='Copied'; setTimeout(()=>b.textContent='Copy',1400); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent='Selected'; };
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch { fallback(); }
  }
});

/* ---------- tour ---------- */
let stepI = 0;
const stepsEl = $('#steps');
stepsEl.innerHTML = STEPS.map((s,i)=>`<button data-step="${i}"><i>${i}</i>${s.k}</button>`).join('');
function setStep(i, ms){
  stepI = Math.max(0, Math.min(STEPS.length-1, i));
  const st = STEPS[stepI];
  panel.hidden = true;
  stepsEl.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-current', j===stepI ? 'true':'false'));
  const sb = stepsEl.querySelector(`[data-step="${stepI}"]`); stepsEl.scrollLeft = sb.offsetLeft - stepsEl.offsetLeft - (stepsEl.clientWidth - sb.offsetWidth)/2;
  $('#cap-k').textContent = `${stepI+1} / ${STEPS.length} · ${st.k}`;
  $('#cap-t').innerHTML = st.text;
  $('#prev').disabled = stepI===0; $('#next').disabled = stepI===STEPS.length-1;
  focusGroups(st.g);
  requestAnimationFrame(()=>goTo(viewFor(areaRect(st.area)), ms));
}
stepsEl.addEventListener('click', e => { const b = e.target.closest('[data-step]'); if (b) setStep(+b.dataset.step); });
$('#prev').onclick = () => setStep(stepI-1);
$('#next').onclick = () => setStep(stepI+1);

document.querySelectorAll('.paths button').forEach(b => b.onclick = () => {
  const on = b.getAttribute('aria-pressed')==='true';
  panel.hidden = true;
  if (on) clearFocus(); else focusGroups(b.dataset.g);
});

/* ---------- pan / zoom input ---------- */
const ptrs = new Map(); let drag = null, moved = false, pinch = null;
vp.addEventListener('pointerdown', e => {
  if (e.button !== 0 && e.pointerType==='mouse') return;
  cancelAnimationFrame(anim);
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size === 1){ drag = {x:e.clientX, y:e.clientY, tx, ty}; moved = false; }
  else if (ptrs.size === 2){
    const [a,b] = [...ptrs.values()];
    pinch = {d: Math.hypot(a.x-b.x, a.y-b.y), s: sc, mx:(a.x+b.x)/2, my:(a.y+b.y)/2, tx, ty}; drag = null; moved = true;
  }
});
vp.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pinch && ptrs.size===2){
    const [a,b] = [...ptrs.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y), mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const ns = Math.min(MAX, Math.max(MIN, pinch.s * d/pinch.d));
    tx = mx - (pinch.mx - pinch.tx)*(ns/pinch.s); ty = my - (pinch.my - pinch.ty)*(ns/pinch.s); sc = ns; apply();
    return;
  }
  if (!drag) return;
  const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
  if (!moved && Math.hypot(dx,dy) > 5){ moved = true; vp.classList.add('dragging'); try{ vp.setPointerCapture(e.pointerId); }catch{} hideHint(); }
  if (moved){ tx = drag.tx+dx; ty = drag.ty+dy; apply(); }
});
const endPtr = e => { ptrs.delete(e.pointerId); if (ptrs.size<2) pinch = null; if (ptrs.size===0){ drag=null; vp.classList.remove('dragging'); } };
vp.addEventListener('pointerup', endPtr); vp.addEventListener('pointercancel', endPtr);
vp.addEventListener('click', e => { if (moved){ e.stopPropagation(); e.preventDefault(); moved=false; } }, true);
vp.addEventListener('click', e => {
  const z = e.target.closest('[data-zoom]');
  if (z){ panel.hidden = true; clearFocus(); goTo(viewFor(areaRect(z.dataset.zoom))); return; }
  const n = e.target.closest('[data-id]');
  if (n){ openPanel(n.dataset.id); return; }
  if (!panel.hidden) closePanel(); else clearFocus();
});
vp.addEventListener('dblclick', e => {
  const n = e.target.closest('.node');
  if (!n) return;
  const r = {x:n.offsetLeft-60, y:n.offsetTop-60, w:n.offsetWidth+120, h:n.offsetHeight+120};
  goTo(viewFor(r));
});
vp.addEventListener('wheel', e => {
  e.preventDefault(); hideHint();
  const mouseWheel = e.deltaMode === 1 || (e.deltaX === 0 && Math.abs(e.deltaY) >= 50 && Number.isInteger(e.deltaY));
  if (e.ctrlKey || mouseWheel){
    const f = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018) * (e.deltaMode===1 ? 16 : 1));
    zoomAt(f, e.clientX, e.clientY);
  } else { cancelAnimationFrame(anim); tx -= e.deltaX; ty -= e.deltaY; apply(); }
}, {passive:false});

$('#z-in').onclick = () => zoomAt(1.25, (innerWidth-panelW())/2, innerHeight/2);
$('#z-out').onclick = () => zoomAt(0.8, (innerWidth-panelW())/2, innerHeight/2);
$('#z-fit').onclick = () => goTo(viewFor(areaRect('all')));

addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  if (e.key==='ArrowRight' || e.key==='PageDown'){ e.preventDefault(); setStep(stepI+1); }
  else if (e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); setStep(stepI-1); }
  else if (e.key==='Escape'){ if (!panel.hidden) closePanel(); else clearFocus(); }
  else if (e.key==='+' || e.key==='='){ zoomAt(1.2, innerWidth/2, innerHeight/2); }
  else if (e.key==='-'){ zoomAt(1/1.2, innerWidth/2, innerHeight/2); }
  else if (e.key==='0' || e.key==='f'){ goTo(viewFor(areaRect('all'))); }
});

/* ---------- minimap ---------- */
const mini = $('#mini');
function buildMini(){
  const ns = [...nodesEl.children].map(el => {
    const n = byId[el.dataset.id]; const col = n.c || (n.tip ? '#E8C93A' : '#F1A598');
    return `<rect class="n" x="${el.offsetLeft}" y="${el.offsetTop}" width="${el.offsetWidth}" height="${el.offsetHeight}" rx="16" style="fill:${col};opacity:.75"/>`;
  }).join('');
  mini.innerHTML = ZONES.map(z=>`<rect class="z" x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="26"/>`).join('') + ns + `<rect class="v" id="mv" rx="12"/>`;
}
function updateMini(){
  const v = document.getElementById('mv'); if (!v) return;
  const x = Math.max(-200, -tx/sc), y = Math.max(-200, -ty/sc);
  v.setAttribute('x', x); v.setAttribute('y', y);
  v.setAttribute('width', Math.min(BW+400, innerWidth/sc)); v.setAttribute('height', Math.min(BH+400, innerHeight/sc));
}
mini.addEventListener('click', e => {
  const r = mini.getBoundingClientRect();
  const wx = (e.clientX - r.left)/r.width * 2640, wy = (e.clientY - r.top)/r.height * 1680;
  goTo({s:sc, x:(innerWidth-panelW())/2 - wx*sc, y:innerHeight/2 - wy*sc}, 400);
});

/* ---------- hint ---------- */
let hintT; function hideHint(){ $('#hint').classList.add('gone'); }
hintT = setTimeout(hideHint, 6000);

/* ---------- boot ---------- */
function layout(){ drawEdges(); buildMini(); }
function start(){
  layout();
  const hash = (location.hash||'').slice(1);
  const si = STEPS.findIndex(s => s.area === hash);
  setStep(si >= 0 ? si : 0, 0);
}
start();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layout(); updateMini(); });
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(()=>{ layout(); updateMini(); }, 120); });
})();
</script>

</body></html>
